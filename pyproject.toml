[project]
name = "better-whoami"
version = "0.1.0-dev"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    # "litestar @ git+https://github.com/litestar-org/litestar.git@v3.0",
    # Branch 3.0 deleted, so we pin to a specific commit temporarily:
    "litestar @ git+https://github.com/litestar-org/litestar.git@02fdd06a8baf67a8dd50fb26ecfe1bc20b353ecb",
    # sniffio is an undeclared dependency of litestar
    "sniffio (>=1.3.1,<2.0.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "dnspython (>=2.7.0,<3.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "uvloop (>=0.21.0,<0.22.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.8"
pyright = "^1.1.400"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "C",
  "DTZ",
  "E",
  "F",
  "FLY",
  "G002",
  "G003",
  "G010",
  "G101",
  "I",
  "N",
  "PL",
  "Q",
  "RET",
  "RUF",
  "S",
  "T10",
  "T20",
  "UP",
  "W",
]
ignore = [
  "N805",
  "PLR0912",
  "PLR0913",
  "RUF100",
  "S101",
  "S104",
]
fixable = ["ALL"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
